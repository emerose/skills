# Packaging for the `reg` CLI so it can be installed as a standalone tool:
#
#     uv tool install "git+https://github.com/emerose/skills#subdirectory=skills/regulator"
#     reg --help
#
# This is OPTIONAL. The skill itself runs the very same code with no install via
# the PEP 723 self-contained script:  `uv run skills/regulator/scripts/reg.py`.
# Library code lives in the importable `regulator` package; `scripts/reg.py` is
# the CLI entry that imports it. The package is also usable directly from Python
# (`from regulator import RegStore`) — see regulator/__init__.py.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regulator"
version = "0.1.0"
description = "A libkit-backed library of FDA regulatory documents (guidance, Drugs@FDA, advisory committees, personnel)"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sam Quigley", email = "quigley@emerose.com" }]
dependencies = [
    "libkit>=0.5.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    "diskcache>=5.6",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/emerose/skills"
Repository = "https://github.com/emerose/skills"

[project.scripts]
reg = "reg:main"

[tool.hatch.build.targets.wheel]
sources = ["scripts"]
only-include = ["regulator", "scripts/reg.py"]
exclude = ["**/__pycache__", "**/*.pyc"]
